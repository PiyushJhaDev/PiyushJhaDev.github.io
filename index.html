<style>
  /* ---------- Tokens: golden hour (light) ---------- */
  :root {
    --bg: #FFF5EE;
    --bg-alt: #FFEBDF;
    --surface: #FFFBF8;
    --ink: #2B1633;
    --muted: #6A4E65;
    --line: rgba(43, 22, 51, 0.14);
    --accent: #B63A2C;
    --sun-a: #FFB547;
    --sun-b: #FF6B3D;
    --sun-c: #E23D6A;
    --dusk: #7A3B86;
    --sky-top: #FFE9D4;
    --sky-mid: #FFCDB2;
    --sky-low: #FF9E8C;
    --ridge-1: #F3A28B;
    --ridge-2: #DB7486;
    --nav-bg: rgba(255, 245, 238, 0.82);
    --chip-bg: rgba(255, 107, 61, 0.1);
    --cta-a: #D1412D;
    --cta-b: #B0275A;
    --shadow: 0 18px 40px -24px rgba(122, 59, 134, 0.45);
    color-scheme: light;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  /* ---------- Tokens: after sundown (dark) ---------- */
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #170E24; --bg-alt: #1F1330; --surface: #261939; --ink: #FBEBE2; --muted: #C6ABBE;
      --line: rgba(251, 235, 226, 0.14); --accent: #FF9A6B;
      --sky-top: #1D1133; --sky-mid: #4A2257; --sky-low: #A8455E;
      --ridge-1: #6A2F62; --ridge-2: #3F1D4B;
      --nav-bg: rgba(23, 14, 36, 0.8); --chip-bg: rgba(255, 154, 107, 0.12);
      --shadow: 0 18px 40px -22px rgba(0, 0, 0, 0.7);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #170E24; --bg-alt: #1F1330; --surface: #261939; --ink: #FBEBE2; --muted: #C6ABBE;
    --line: rgba(251, 235, 226, 0.14); --accent: #FF9A6B;
    --sky-top: #1D1133; --sky-mid: #4A2257; --sky-low: #A8455E;
    --ridge-1: #6A2F62; --ridge-2: #3F1D4B;
    --nav-bg: rgba(23, 14, 36, 0.8); --chip-bg: rgba(255, 154, 107, 0.12);
    --shadow: 0 18px 40px -22px rgba(0, 0, 0, 0.7);
    color-scheme: dark;
  }

  *, *::before, *::after { box-sizing: border-box; }
  html { scroll-behavior: smooth; scroll-padding-top: calc(env(safe-area-inset-top, 0px) + 72px); }
  @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Instrument Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
    font-size: 1.0625rem;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
    transition: background-color .4s ease, color .4s ease;
  }
  body::before {
    content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px);
    z-index: 10; background: var(--nav-bg); backdrop-filter: blur(14px);
  }
  img, svg { max-width: 100%; }
  a { color: inherit; }
  h1, h2, h3 { font-family: "Bricolage Grotesque", "Arial Narrow", system-ui, sans-serif; margin: 0; line-height: 1.05; }
  h2 { font-size: clamp(2.2rem, 5vw, 3.6rem); font-weight: 700; letter-spacing: -0.03em; }
  h3 { font-size: 1.35rem; font-weight: 600; letter-spacing: -0.01em; }
  p { margin: 0; }
  :focus-visible { outline: 3px solid var(--sun-b); outline-offset: 3px; border-radius: 6px; }
  .wrap { width: min(1160px, 100% - 3rem); margin-inline: auto; position: relative; z-index: 2; }
  .plx { will-change: transform; }
  .layer { position: absolute; inset: 0; pointer-events: none; }
  .plx-cell { display: flex; }
  .plx-cell > * { flex: 1; }
  .featured-cell { grid-column: span 2; }
  @media (max-width: 640px) { .featured-cell { grid-column: auto; } }

  /* ---------- Navigation ---------- */
  .site-header {
    position: fixed; top: 0; left: 0; right: 0; z-index: 50;
    padding-top: env(safe-area-inset-top, 0px);
    transition: background-color .3s ease, box-shadow .3s ease;
  }
  .site-header.scrolled { background: var(--nav-bg); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); box-shadow: 0 1px 0 var(--line); }
  .nav { height: 68px; display: flex; align-items: center; justify-content: space-between; gap: 1rem; }
  .brand {
    font-family: "Bricolage Grotesque", system-ui, sans-serif; font-weight: 800; font-size: 1.25rem;
    text-decoration: none; display: flex; align-items: center; gap: .55rem; letter-spacing: -0.02em;
  }
  .brand-mark { width: 26px; height: 26px; border-radius: 50%; background: linear-gradient(180deg, var(--sun-a), var(--sun-b) 55%, var(--sun-c)); }
  .nav-links { display: flex; gap: .25rem; list-style: none; margin: 0; padding: 0; }
  .nav-links a {
    text-decoration: none; font-weight: 500; font-size: .98rem; padding: .5rem .8rem; border-radius: 999px;
    color: var(--muted); transition: color .2s, background-color .2s;
  }
  .nav-links a:hover { color: var(--ink); }
  .nav-links a.active { color: var(--ink); background: var(--chip-bg); }
  .nav-actions { display: flex; align-items: center; gap: .5rem; }
  .icon-btn {
    width: 42px; height: 42px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface);
    color: var(--ink); display: grid; place-items: center; cursor: pointer; transition: transform .3s ease;
  }
  .icon-btn:hover { transform: rotate(-12deg); }
  .menu-btn { display: none; }
  @media (max-width: 860px) {
    .menu-btn { display: grid; }
    .nav-links {
      position: absolute; top: calc(100% - 4px); left: 1rem; right: 1rem; flex-direction: column;
      background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: .6rem;
      box-shadow: var(--shadow); opacity: 0; transform: translateY(-8px); pointer-events: none;
      transition: opacity .2s ease, transform .2s ease;
    }
    .nav-links.open { opacity: 1; transform: none; pointer-events: auto; }
    .nav-links a { display: block; padding: .8rem 1rem; font-size: 1.05rem; }
  }

  /* ---------- Hero ---------- */
  .hero {
    position: relative; min-height: 100svh; overflow: hidden;
    background: linear-gradient(180deg, var(--sky-top) 0%, var(--sky-mid) 55%, var(--sky-low) 100%);
    display: flex; align-items: flex-start;
    transition: background .4s ease;
  }
  .hero-copy { padding-top: clamp(120px, 20vh, 190px); padding-bottom: 42vh; max-width: 760px; }
  .hello { font-size: 1.15rem; font-weight: 500; color: var(--muted); margin-bottom: 1rem; }
  .hero h1 {
    font-size: clamp(2.7rem, 6.6vw, 5.6rem); font-weight: 800; letter-spacing: -0.035em; line-height: .98;
    max-width: 14ch;
  }
  .hero-lede { margin-top: 1.5rem; font-size: clamp(1.05rem, 1.6vw, 1.22rem); max-width: 54ch; color: var(--ink); opacity: .85; }
  .cta-row { margin-top: 2rem; display: flex; flex-wrap: wrap; gap: .8rem; align-items: center; }
  .btn {
    display: inline-flex; align-items: center; gap: .5rem; padding: .85rem 1.4rem; border-radius: 999px;
    font-weight: 600; font-size: 1rem; text-decoration: none; cursor: pointer; border: 0; font-family: inherit;
    transition: transform .2s ease, box-shadow .2s ease;
  }
  .btn-primary { background: linear-gradient(100deg, var(--cta-a), var(--cta-b)); color: #fff; box-shadow: 0 10px 24px -12px var(--cta-b); }
  .btn-primary:hover { transform: translateY(-2px); }
  .btn-ghost { background: transparent; color: var(--ink); border: 1.5px solid var(--ink); }
  .btn-ghost:hover { background: var(--ink); color: var(--bg); }
  .status { display: inline-flex; align-items: center; gap: .5rem; margin-top: 1.6rem; font-size: .95rem; color: var(--muted); }
  .status::before { content: ""; width: 9px; height: 9px; border-radius: 50%; background: #2FB67C; box-shadow: 0 0 0 4px rgba(47, 182, 124, .2); }

  .sun {
    position: absolute; border-radius: 50%;
    background: linear-gradient(180deg, var(--sun-a) 0%, var(--sun-b) 55%, var(--sun-c) 100%);
    -webkit-mask-image: linear-gradient(180deg, #000 0 52%, transparent 52% 56%, #000 56% 64%, transparent 64% 69%, #000 69% 76%, transparent 76% 82%, #000 82% 88%, transparent 88% 95%, #000 95%);
            mask-image: linear-gradient(180deg, #000 0 52%, transparent 52% 56%, #000 56% 64%, transparent 64% 69%, #000 69% 76%, transparent 76% 82%, #000 82% 88%, transparent 88% 95%, #000 95%);
  }
  .hero .sun { width: clamp(240px, 36vw, 520px); aspect-ratio: 1; right: 7%; bottom: 14%; }
  .sun-glow {
    position: absolute; width: clamp(420px, 60vw, 900px); aspect-ratio: 1; right: -6%; bottom: -14%;
    background: radial-gradient(circle, rgba(255, 181, 71, .45), transparent 62%); border-radius: 50%;
  }
  .ridge { position: absolute; left: 0; bottom: -2px; width: 100%; height: 40vh; display: block; }
  .ridge-1 path { fill: var(--ridge-1); }
  .ridge-2 path { fill: var(--ridge-2); }
  .ridge-3 path { fill: var(--bg); }

  @media (max-width: 720px) {
    .hero .sun { right: 50%; transform: translateX(50%); bottom: 10%; width: 70vw; opacity: .9; }

  /* ---------- Sections ---------- */
  .section { position: relative; padding: clamp(5rem, 11vw, 8.5rem) 0; overflow: hidden; }
  .section.alt { background: var(--bg-alt); transition: background-color .4s ease; }
  .section-head { margin-bottom: clamp(2.2rem, 5vw, 3.5rem); max-width: 640px; }
  .section-head p { margin-top: 1rem; color: var(--muted); font-size: 1.1rem; }

  .ring { position: absolute; border-radius: 50%; border: 1.5px solid var(--sun-b); opacity: .35; }
  .orb { position: absolute; border-radius: 50%; filter: blur(4px); }
  .slices { position: absolute; display: grid; gap: 14px; }
  .slices span { display: block; height: 12px; border-radius: 6px; background: linear-gradient(90deg, var(--sun-a), var(--sun-c)); opacity: .5; }

  /* About */
  .about-grid { display: grid; grid-template-columns: 1.4fr 1fr; gap: clamp(2rem, 6vw, 5rem); align-items: start; }
  .about-text p + p { margin-top: 1.1rem; }
  .about-text p { max-width: 62ch; }
  .about-text .lead { font-size: 1.3rem; line-height: 1.5; font-family: "Bricolage Grotesque", system-ui, sans-serif; font-weight: 500; }
  .facts { border: 1px solid var(--line); background: var(--surface); border-radius: 24px; padding: 1.6rem; box-shadow: var(--shadow); }
  .facts dl { margin: 0; display: grid; gap: 1.1rem; }
  .facts dt { font-size: .9rem; color: var(--muted); }
  .facts dd { margin: .15rem 0 0; font-weight: 600; }
  .facts .years { font-family: "Bricolage Grotesque", system-ui, sans-serif; font-size: 3.2rem; font-weight: 800; line-height: 1; letter-spacing: -0.04em; }
  @media (max-width: 860px) { .about-grid { grid-template-columns: 1fr; } }

  /* Skills */
  .skill-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 1.25rem; }
  .skill-group { background: var(--surface); border: 1px solid var(--line); border-radius: 22px; padding: 1.6rem 1.6rem 1.7rem; position: relative; overflow: hidden; }
  .skill-group::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 5px; background: var(--stop); }
  .skill-group p { color: var(--muted); margin: .45rem 0 1.1rem; font-size: .98rem; }
  .chips { display: flex; flex-wrap: wrap; gap: .5rem; list-style: none; padding: 0; margin: 0; }
  .chips li { background: var(--chip-bg); border-radius: 999px; padding: .35rem .8rem; font-size: .92rem; font-weight: 500; }
  @media (max-width: 760px) { .skill-grid { grid-template-columns: 1fr; } }

  /* Projects */
  .filters { display: flex; flex-wrap: wrap; gap: .5rem; margin-bottom: 2rem; }
  .filter {
    font-family: inherit; font-size: .98rem; font-weight: 500; padding: .55rem 1.1rem; border-radius: 999px;
    border: 1.5px solid var(--line); background: transparent; color: var(--ink); cursor: pointer;
  }
  .filter[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  .project-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1.25rem; }
  .project {
    background: var(--surface); border: 1px solid var(--line); border-radius: 22px; padding: 1.6rem;
    display: flex; flex-direction: column; gap: .8rem; transition: transform .25s ease, box-shadow .25s ease;
  }
  .project:hover { transform: translateY(-4px); box-shadow: var(--shadow); }
  .project.featured { grid-column: span 2; background: linear-gradient(140deg, var(--surface) 40%, var(--chip-bg)); }
  .project.featured h3 { font-size: 1.8rem; }
  .tag { align-self: flex-start; font-size: .82rem; font-weight: 600; color: var(--accent); }
  .project p { color: var(--muted); font-size: .98rem; }
  .project .outcome { color: var(--ink); font-weight: 600; }
  .project .chips { margin-top: auto; padding-top: .4rem; }
  .project .chips li { font-size: .82rem; padding: .25rem .65rem; }
  @media (max-width: 980px) { .project-grid { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 640px) { .project-grid { grid-template-columns: 1fr; } .project.featured { grid-column: auto; } }

  /* Experience */
  .timeline { list-style: none; margin: 0; padding: 0; position: relative; }
  .timeline::before {
    content: ""; position: absolute; left: 190px; top: 8px; bottom: 8px; width: 3px; border-radius: 3px;
    background: linear-gradient(180deg, var(--sun-a), var(--sun-b), var(--sun-c), var(--dusk));
  }
  .job { display: grid; grid-template-columns: 190px 1fr; padding-bottom: 2.8rem; }
  .job:last-child { padding-bottom: 0; }
  .job-years { font-weight: 600; color: var(--muted); padding-top: .15rem; padding-right: 1.5rem; }
  .job-body { padding-left: 2.2rem; position: relative; }
  .job-body::before {
    content: ""; position: absolute; left: -7px; top: .45rem; width: 17px; height: 17px; border-radius: 50%;
    background: var(--bg-alt); border: 3px solid var(--sun-b);
  }
  .job-company { color: var(--accent); font-weight: 600; margin-top: .2rem; }
  .job ul { margin: .8rem 0 0; padding-left: 1.1rem; max-width: 70ch; }
  .job li + li { margin-top: .35rem; }
  .job .chips { margin-top: 1rem; }
  .job .chips li { font-size: .82rem; padding: .25rem .65rem; }
  @media (max-width: 720px) {
    .timeline::before { left: 7px; }
    .job { grid-template-columns: 1fr; }
    .job-years { padding-left: 2.2rem; padding-right: 0; }
  }

  /* Contact */
  .contact { padding-bottom: clamp(230px, 30vw, 320px); }
  .contact-grid { display: grid; grid-template-columns: 1fr 1.1fr; gap: clamp(2rem, 6vw, 5rem); }
  .contact-links { display: grid; gap: .8rem; margin-top: 2rem; }
  .contact-links a { font-weight: 600; text-decoration-color: var(--sun-b); text-underline-offset: 5px; text-decoration-thickness: 2px; }
  form { background: var(--surface); border: 1px solid var(--line); border-radius: 24px; padding: clamp(1.4rem, 3vw, 2rem); display: grid; gap: 1rem; box-shadow: var(--shadow); }
  label { font-weight: 600; font-size: .95rem; display: grid; gap: .4rem; }
  input, textarea {
    font: inherit; color: var(--ink); background: var(--bg); border: 1.5px solid var(--line); border-radius: 12px;
    padding: .75rem .9rem; width: 100%;
  }
  input:focus, textarea:focus { outline: none; border-color: var(--sun-b); box-shadow: 0 0 0 4px var(--chip-bg); }
  textarea { min-height: 140px; resize: vertical; }
  .form-note { font-size: .92rem; color: var(--muted); }
  .form-note.ok { color: var(--ink); }
  .contact .sun { width: clamp(220px, 28vw, 340px); aspect-ratio: 1; left: 50%; bottom: 40px; transform: translateX(-50%); opacity: .95; }
  .contact .ridge { height: clamp(120px, 16vw, 190px); }
  .contact .ridge path { fill: var(--bg-alt); }
  @media (max-width: 860px) { .contact-grid { grid-template-columns: 1fr; } }

  footer { background: var(--bg-alt); padding: 2rem 0 2.4rem; font-size: .95rem; color: var(--muted); transition: background-color .4s ease; }
  footer .wrap { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 1rem; }

  @media (prefers-reduced-motion: reduce) {
    .plx { transform: none !important; }
    *, *::before, *::after { transition-duration: .01ms !important; }
  }
</style>
</head>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef } = React;

/* ---------- Parallax engine: one rAF loop drives every layer ---------- */
const layers = new Set();
const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)");
let ticking = false;

function updateLayers() {
  ticking = false;
  const vh = window.innerHeight;
  const vw = window.innerWidth;
  layers.forEach(({ el, speed, mobileSpeed, mobileBelow, host }) => {
    const r = host.getBoundingClientRect();
    if (r.bottom < -vh || r.top > vh * 2) return;
    if (reduceMotion.matches) { el.style.transform = ""; return; }
    const offset = r.top + r.height / 2 - vh / 2;
    const s = mobileSpeed !== null && vw < mobileBelow ? mobileSpeed : speed;
    el.style.transform = `translate3d(0, ${(offset * s).toFixed(1)}px, 0)`;
  });
}
function requestUpdate() {
  if (!ticking) { ticking = true; requestAnimationFrame(updateLayers); }
}
window.addEventListener("scroll", requestUpdate, { passive: true });
window.addEventListener("resize", requestUpdate);

/* Positive speed: layer lags behind the scroll. Negative: it sinks as you scroll down. */
/* mobileSpeed replaces speed below the mobileBelow width, so stacked layouts never overlap. */
function Parallax({ speed = 0.15, mobileSpeed = null, mobileBelow = 880, className = "", children, style }) {
  const ref = useRef(null);
  useEffect(() => {
    const el = ref.current;
    const host = el.closest("section") || el.parentElement;
    const item = { el, speed, mobileSpeed, mobileBelow, host };
    layers.add(item);
    requestUpdate();
    return () => layers.delete(item);
  }, [speed, mobileSpeed, mobileBelow]);
  return <div ref={ref} className={"plx " + className} style={style}>{children}</div>;
}

/* ---------- Hooks ---------- */
function useTheme() {
  const [theme, setTheme] = useState(() => {
    try {
      const saved = localStorage.getItem("portfolio-theme");
      if (saved === "light" || saved === "dark") return saved;
    } catch (e) {}
    return window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
  });
  useEffect(() => {
    document.documentElement.setAttribute("data-theme", theme);
    try { localStorage.setItem("portfolio-theme", theme); } catch (e) {}
  }, [theme]);
  return [theme, () => setTheme(t => (t === "dark" ? "light" : "dark"))];
}

function useActiveSection(ids) {
  const [active, setActive] = useState("");
  useEffect(() => {
    const obs = new IntersectionObserver(
      entries => entries.forEach(e => e.isIntersecting && setActive(e.target.id)),
      { rootMargin: "-45% 0px -50% 0px" }
    );
    ids.forEach(id => { const el = document.getElementById(id); if (el) obs.observe(el); });
    return () => obs.disconnect();
  }, []);
  return active;
}
